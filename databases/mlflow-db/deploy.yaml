apiVersion: v1
kind: PersistentVolume
metadata:
  name: mlflow-db84-local-pv
  labels:
    app: mlflow-db
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    # Use a new, empty directory; never point 8.4 at a 5.7 data directory.
    path: VOLUME_PATH_MYSQL84
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - HOSTNAME_DNS

---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: mlflow-db84-pv-claim
  namespace: databases
  labels:
    app: mlflow-db
spec:
  storageClassName: manual
  volumeName: mlflow-db84-local-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-db
  namespace: databases
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow-db
  replicas: 1
  template:
    metadata:
      labels:
        app: mlflow-db
    spec:
      containers:
        - name: mysql
          image: mysql@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
          imagePullPolicy: "IfNotPresent"
          args: ["--log-bin-trust-function-creators=1"]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mlflow-db84-secret, key: MYSQL_ROOT_PASSWORD}
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef: {name: mlflow-db84-secret, key: MYSQL_DATABASE}
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: {name: mlflow-db84-secret, key: MYSQL_USER}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: mlflow-db84-secret, key: MYSQL_PASSWORD}
          ports:
            - name: mysql
              containerPort: 3306
          startupProbe:
            tcpSocket: {port: mysql}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$MYSQL_USER" "$MYSQL_DATABASE" -Nse "SELECT 1"'
            periodSeconds: 5
            timeoutSeconds: 5
                
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mlflow-db
              readOnly: false
      volumes:
        - name: mlflow-db
          persistentVolumeClaim:
            claimName: mlflow-db84-pv-claim
---
apiVersion: v1
kind: Service
metadata:
  namespace: databases
  name: mlflow-db-service
spec:
  selector:
    app: mlflow-db
  type: NodePort
  ports:
    - name: mlflow-db
      port: 3306
      nodePort: 30706
