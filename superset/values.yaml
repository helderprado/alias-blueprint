# -- A dictionary of overrides to append at the end of superset_config.py - the name does not matter
# WARNING: the order is not guaranteed
# Files can be passed as helm --set-file configOverrides.my-override=my-file.py
configOverrides:
  secret: |
    import os
    from urllib.parse import quote
    SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
    SQLALCHEMY_DATABASE_URI = (
        "postgresql+psycopg2://" + quote(os.environ["DB_USER"], safe="") + ":" +
        quote(os.environ["DB_PASS"], safe="") + "@" + os.environ["DB_HOST"] +
        ":5432/" + quote(os.environ["DB_NAME"], safe="")
    )
    _redis_auth = quote(os.environ["REDIS_PASSWORD"], safe="")
    _redis_host = os.environ.get("REDIS_HOST", "superset-redis-headless")
    _redis_url = "redis://:" + _redis_auth + "@" + _redis_host + ":6379/"
    CACHE_CONFIG = {"CACHE_TYPE": "RedisCache", "CACHE_REDIS_URL": _redis_url + "1"}
    DATA_CACHE_CONFIG = CACHE_CONFIG.copy()
    class CeleryConfig:
        broker_url = _redis_url + "0"
        result_backend = _redis_url + "0"
        imports = ("superset.sql_lab", "superset.tasks.scheduler")
    CELERY_CONFIG = CeleryConfig

    BABEL_DEFAULT_LOCALE = 'pt_BR'
    BABEL_DEFAULT_TIMEZONE = 'America/Recife'

    TALISMAN_ENABLED = False

    EXCEL_EXTENSIONS = {"xlsx", "xls"}
    CSV_EXTENSIONS = {"csv", "tsv", "txt"}
    COLUMNAR_EXTENSIONS = {"parquet", "zip"}
    ALLOWED_EXTENSIONS = {*EXCEL_EXTENSIONS, *CSV_EXTENSIONS, *COLUMNAR_EXTENSIONS}
    
    ENABLE_JAVASCRIPT_CONTROLS = True
    DASHBOARD_VIRTUALIZATION = True
    ENABLE_EXPLORE_DRAG_AND_DROP = True
    
    PUBLIC_ROLE_LIKE="Gamma"

    DEFAULT_FEATURE_FLAGS = {
        "ENABLE_JAVASCRIPT_CONTROLS": True,
        "DASHBOARD_NATIVE_FILTERS": True,
        "DASHBOARD_CROSS_FILTERS": True,
        "PUBLIC_ROLE_LIKE_GAMMA": True,
        "ALERT_REPORTS": True,
        "DASHBOARD_RBAC": True,
        "DASHBOARD_VIRTUALIZATION": True,
        "ENABLE_EXPLORE_DRAG_AND_DROP": True,
        "ENABLE_TEMPLATE_PROCESSING": True,
        "ALERT_REPORTS": True,
        "ALERTS_ATTACH_REPORTS": True,
        "EMBEDDED_SUPERSET": True,
        "ALLOW_FULL_CSV_EXPORT": False,
        "EMBEDDABLE_CHARTS": True,
        "DRILL_TO_DETAIL": True,
        "DRILL_BY": True,
        "ENABLE_TEMPLATE_PROCESSING": True
    }

  # extend_timeout: |
