hub:
  image:
    name: quay.io/jupyterhub/k8s-hub
    tag: '3.2.1'
    pullPolicy: 'Always'
    pullSecrets: 
      - regcred

  extraEnv:
    JUPYTERHUB_CRYPT_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-runtime
          key: crypt-key
    JUPYTERHUB_AUTH_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: jupyterhub-runtime
          key: auth-password

  config:
    JupyterHub:
      authenticator_class: "dummy"

  extraConfig:
    credentials: |
      import os
      password = os.environ["JUPYTERHUB_AUTH_PASSWORD"]
      if not password:
          raise ValueError("JUPYTERHUB_AUTH_PASSWORD must be nonempty")
      c.DummyAuthenticator.password = password
    startTimeout: |
      c.KubeSpawner.start_timeout = 600  # Timeout de 10 minutos para iniciar os pods dos usuários

    pod_ip: |
      from kubernetes_asyncio import client
      def modify_pod_hook(spawner, pod):
          pod.spec.containers[0].env.append(client.V1EnvVar("MY_POD_IP", None, client.V1EnvVarSource(None, client.V1ObjectFieldSelector(None, "status.podIP"))))
          return pod
      c.KubeSpawner.modify_pod_hook = modify_pod_hook

proxy:
  secretToken: ""
  service:
    type: NodePort
    nodePorts:
      http: 8889

singleuser:
  storage:
    type: "static"
    static:
      pvcName: "nfs-share-pvc"
      subPath: "{username}"
    capacity: 10Gi
    homeMountPath: /home/jovyan/work
  serviceAccountName: spark
  image:
    name: jupyter/all-spark-notebook
    tag: python-3.11
    pullPolicy: IfNotPresent
    pullSecrets: []
  cpu:
    limit: 1
    guarantee: 0.5
  memory:
    limit: 2G
    guarantee: 1G
  defaultUrl: "/lab"
  cmd: jupyterhub-singleuser
  networkPolicy:
    enabled: false
  extraEnv:
    AWS_ACCESS_KEY: ""
    AWS_SECRET_KEY: ""
